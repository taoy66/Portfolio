baseURL: "https://taoy66.github.io/Portfolio/"
canonifyURLs: true
relativeURLs: false
languageCode: "en-us"
title: "Tao Yan"
theme: "PaperMod"

pagination:
  pagerSize: 8

params:

  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enchanced SEO
  env: production

    # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single pages



  profileMode:
    enabled: true
    title: "Tao Yan"
    subtitle: |
      **Mechanical Design & R&D** • Additive Manufacturing • Heat Transfer
      **AI-assisted Engineering** and reliable mechanism design
    imageUrl: "images/avatar.JPG"
    imageWidth: 260
    imageHeight: 260
    imageTitle: "Tao Yan"
    buttons:
      - name: "Resume"
        url: "resume/"

  socialIcons:
    - name: "email"
      url: "mailto:tao.tom.yan@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/tao-yan-5bb904190/"
    - name: "github"
      url: "https://github.com/taoy66"



menu:
  main:
    - identifier: "home"
      name: "Home"
      url: ""
      weight: 10
    - identifier: "projects"
      name: "Projects"
      url: "projects/"
      weight: 20
    - identifier: "certificates"
      name: "Certificates"
      url: "certificates/"
      weight: 30
    - identifier: "experience"
      name: "Experience"
      url: "experience/"
      weight: 40


# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true